<!DOCTYPE html>
<html lang="en">

<head>
  <script>(function () { try { var p = localStorage.getItem('ee_theme') || 'system'; var d = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light'); } catch (e) { } })();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — EchoEats</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>" />
  <style>
    .admin-wrap {
      display: flex;
      min-height: 100vh;
      padding-top: 0;
    }

    .admin-sidebar {
      width: 240px;
      background: var(--green-900);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 28px 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .admin-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 24px 28px;
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
    }

    .admin-logo-icon {
      font-size: 22px;
    }

    .admin-badge {
      background: #ef4444;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 100px;
      margin-left: auto;
    }

    .admin-nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 24px;
      color: rgba(255, 255, 255, 0.65);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      transition: all 0.15s;
    }

    .admin-nav-item:hover,
    .admin-nav-item.active {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .admin-nav-section {
      padding: 16px 24px 6px;
      font-size: 10px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.3);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .admin-main {
      flex: 1;
      background: var(--bg);
      overflow-y: auto;
      padding: 40px;
    }

    .admin-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .admin-page-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--dark);
      letter-spacing: -0.5px;
    }

    .admin-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .vendor-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      gap: 20px;
      transition: box-shadow 0.2s;
    }

    .vendor-card:hover {
      box-shadow: var(--shadow);
    }

    .vendor-avatar {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--green-100);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      color: var(--green-700);
      flex-shrink: 0;
    }

    .vendor-info {
      flex: 1;
    }

    .vendor-name {
      font-size: 16px;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 4px;
    }

    .vendor-meta {
      font-size: 13px;
      color: var(--text-soft);
      margin-bottom: 10px;
    }

    .vendor-details {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .vendor-detail-chip {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 12px;
      color: var(--text-soft);
    }

    .vendor-detail-chip strong {
      color: var(--dark);
    }

    .vendor-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-approve {
      background: var(--green-700);
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-approve:hover {
      background: var(--green-800);
    }

    .btn-reject {
      background: #fef2f2;
      color: #dc2626;
      border: 1.5px solid #fecaca;
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-reject:hover {
      background: #fee2e2;
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status-approved {
      background: #d1fae5;
      color: #065f46;
    }

    .status-rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 56px;
      margin-bottom: 16px;
    }

    .empty-state-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 8px;
    }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-box {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
    }

    .stat-num {
      font-size: 32px;
      font-weight: 900;
      color: var(--dark);
      letter-spacing: -1px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .tab-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      width: fit-content;
    }

    .tab-btn {
      padding: 8px 20px;
      border-radius: 8px;
      border: none;
      background: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-soft);
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab-btn.active {
      background: var(--white);
      color: var(--dark);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    @media(max-width:768px) {
      .admin-sidebar {
        display: none;
      }

      .admin-main {
        padding: 24px 16px;
      }

      .stat-row {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="admin-wrap">

    <!-- Sidebar -->
    <div class="admin-sidebar">
      <a href="index.html" class="admin-logo">
        <div class="admin-logo-icon">🌿</div>
        EchoEats
      </a>
      <div class="admin-nav-section">Management</div>
      <button class="admin-nav-item active" id="nav-vendors" onclick="showSection('vendors',this)">🏪 Vendor
        Applications <span class="admin-badge" id="pending-badge">0</span></button>
      <button class="admin-nav-item" id="nav-all" onclick="showSection('all',this)">👥 All Users</button>
      <div class="admin-nav-section">System</div>
      <a href="index.html" class="admin-nav-item">🏠 View Site</a>
      <button class="admin-nav-item" onclick="logout()">🚪 Sign Out</button>
    </div>

    <!-- Main -->
    <div class="admin-main">

      <!-- Stats -->
      <div id="section-vendors">
        <div class="admin-topbar">
          <div>
            <div class="admin-page-title">🛡️ Admin Panel</div>
            <div class="admin-subtitle" id="admin-welcome">Vendor applications are decided automatically 24h after
              submission — this view is read-only</div>
          </div>
          <button class="btn btn-outline btn-sm" onclick="refreshData()">↻ Refresh</button>
        </div>

        <div class="stat-row" id="stats-row"></div>

        <div class="tab-bar">
          <button class="tab-btn active" id="tab-pending" onclick="switchTab('pending',this)">Pending</button>
          <button class="tab-btn" id="tab-approved" onclick="switchTab('approved',this)">Approved</button>
          <button class="tab-btn" id="tab-rejected" onclick="switchTab('rejected',this)">Rejected</button>
        </div>

        <div id="vendor-list"></div>
      </div>

      <div id="section-all" style="display:none">
        <div class="admin-topbar">
          <div class="admin-page-title">👥 All Users</div>
        </div>
        <div id="all-users-list"></div>
      </div>

    </div>
  </div>

  <script src="main.js"></script>
  <script>
    // @ts-nocheck
    let currentTab = 'pending';

    function getUsers() {
      return JSON.parse(localStorage.getItem('ee_users') || '[]');
    }
    function saveUsers(users) {
      localStorage.setItem('ee_users', JSON.stringify(users));
    }

    // Vendor decisions are now fully automatic: a scheduled function
    // decides approve/reject 24h after application (based on the rules
    // in netlify/functions/send-vendor-decision-emails.js) and emails
    // the vendor directly. This panel is read-only — no more manual
    // approve/reject here.

    function switchTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderVendorList();
    }

    function renderVendorList() {
      const users = getUsers();
      const vendors = users.filter(u => eeUserHasRole(u, 'vendor') && u.vendorStatus === currentTab);
      const list = document.getElementById('vendor-list');

      if (!vendors.length) {
        const labels = { pending: 'No pending applications', approved: 'No approved vendors yet', rejected: 'No rejected applications' };
        const icons = { pending: '📭', approved: '✅', rejected: '🗑️' };
        list.innerHTML = `<div class="empty-state">
        <div class="empty-state-icon">${icons[currentTab]}</div>
        <div class="empty-state-title">${labels[currentTab]}</div>
        <p style="font-size:13px;color:var(--text-muted)">New vendor applications will appear here.</p>
      </div>`;
        return;
      }

      list.innerHTML = vendors.map(v => `
      <div class="vendor-card" id="vc-${v.id}">
        <div class="vendor-avatar">${(v.businessName || v.name || '?')[0].toUpperCase()}</div>
        <div class="vendor-info">
          <div class="vendor-name">${esc(v.businessName || v.name)}</div>
          <div class="vendor-meta">${esc(v.name)} · ${esc(v.email)}</div>
          <div class="vendor-details">
            <div class="vendor-detail-chip"><strong>Type:</strong> ${esc(v.businessType || 'N/A')}</div>
            <div class="vendor-detail-chip"><strong>Address:</strong> ${esc(v.businessAddress || 'N/A')}</div>
            <div class="vendor-detail-chip"><strong>Joined:</strong> ${v.joinDate ? new Date(v.joinDate).toLocaleDateString() : 'N/A'}</div>
            <div class="vendor-detail-chip">
              <strong>Status:</strong>
              <span class="status-pill ${v.vendorStatus === 'pending' ? 'status-pending' : v.vendorStatus === 'approved' ? 'status-approved' : 'status-rejected'}" style="margin-left:4px">${v.vendorStatus}</span>
            </div>
          </div>
        </div>
        <div class="vendor-actions">
          ${v.vendorStatus === 'pending'
          ? `<span class="status-pill status-pending">⏳ Awaiting automatic decision (24h from application)</span>`
          : `<span class="status-pill ${v.vendorStatus === 'approved' ? 'status-approved' : 'status-rejected'}">Decided automatically${v.decisionReason ? ' — ' + esc(v.decisionReason) : ''}</span>`}
        </div>
      </div>`).join('');
    }

    function renderStats() {
      const users = getUsers();
      const vendors = users.filter(u => eeUserHasRole(u, 'vendor'));
      const pending = vendors.filter(u => u.vendorStatus === 'pending').length;
      const approved = vendors.filter(u => u.vendorStatus === 'approved').length;
      const rejected = vendors.filter(u => u.vendorStatus === 'rejected').length;
      const consumers = users.filter(u => eeUserHasRole(u, 'consumer')).length;

      document.getElementById('pending-badge').textContent = pending;
      document.getElementById('pending-badge').style.display = pending > 0 ? '' : 'none';

      document.getElementById('stats-row').innerHTML = `
      <div class="stat-box"><div class="stat-num" style="color:#f59e0b">${pending}</div><div class="stat-label">Pending</div></div>
      <div class="stat-box"><div class="stat-num" style="color:var(--green-700)">${approved}</div><div class="stat-label">Approved Vendors</div></div>
      <div class="stat-box"><div class="stat-num" style="color:#ef4444">${rejected}</div><div class="stat-label">Rejected</div></div>
      <div class="stat-box"><div class="stat-num">${consumers}</div><div class="stat-label">Consumers</div></div>
    `;
    }

    function renderAllUsers() {
      const users = getUsers().filter(u => !eeUserHasRole(u, 'admin'));
      const list = document.getElementById('all-users-list');
      list.innerHTML = `
      <div style="background:var(--white);border:1px solid var(--border);border-radius:16px;overflow:hidden">
        <table style="width:100%;border-collapse:collapse">
          <thead><tr style="background:var(--bg);border-bottom:1px solid var(--border)">
            <th style="padding:12px 16px;text-align:left;font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase">Name</th>
            <th style="padding:12px 16px;text-align:left;font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase">Email</th>
            <th style="padding:12px 16px;text-align:left;font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase">Role</th>
            <th style="padding:12px 16px;text-align:left;font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase">Status</th>
            <th style="padding:12px 16px;text-align:left;font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase">Joined</th>
          </tr></thead>
          <tbody>
            ${users.map(u => `<tr style="border-bottom:1px solid var(--border)">
              <td style="padding:14px 16px;font-weight:600;color:var(--dark)">${esc(u.name)}</td>
              <td style="padding:14px 16px;color:var(--text-soft);font-size:13px">${esc(u.email)}</td>
              <td style="padding:14px 16px">${eeUserRoles(u).map(r => `<span class="status-pill ${r === 'vendor' ? 'status-blue' : 'status-green'}" style="text-transform:capitalize;margin-right:4px">${r}</span>`).join('')}</td>
              <td style="padding:14px 16px">${eeUserHasRole(u, 'vendor') ? `<span class="status-pill ${u.vendorStatus === 'pending' ? 'status-pending' : u.vendorStatus === 'rejected' ? 'status-orange' : 'status-green'}">${u.vendorStatus || 'approved'}</span>` : `<span class="status-pill status-green">approved</span>`}</td>
              <td style="padding:14px 16px;color:var(--text-muted);font-size:12px">${u.joinDate ? new Date(u.joinDate).toLocaleDateString() : '—'}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
    }

    function refreshData() {
      renderStats();
      renderVendorList();
      renderAllUsers();
    }

    function showSection(name, btn) {
      ['vendors', 'all'].forEach(s => {
        const el = document.getElementById('section-' + s);
        if (el) el.style.display = s === name ? '' : 'none';
      });
      document.querySelectorAll('.admin-nav-item').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      if (name === 'all') renderAllUsers();
    }

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function logout() {
      localStorage.removeItem('ee_current_user');
      if (typeof clearSupabaseSession === 'function') clearSupabaseSession();
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const raw = localStorage.getItem('ee_current_user');
      if (!raw) { window.location.href = 'login.html'; return; }
      const user = JSON.parse(raw);
      if (user.role !== 'admin') { window.location.href = 'index.html'; return; }

      document.getElementById('admin-welcome').textContent = 'Signed in as ' + user.name + ' · ' + user.email;
      refreshData();
    });
  </script>
</body>

</html>
