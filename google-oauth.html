<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in – Google Accounts</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Google Sans', 'Roboto', Arial, sans-serif;
      background: #fff;
      color: #202124;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .g-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px 10px;
      border-bottom: 1px solid #e8eaed;
    }

    .g-logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 20px;
      font-weight: 500;
      color: #5f6368;
      letter-spacing: -.3px;
    }

    .g-logo svg {
      display: block;
    }

    .g-close {
      width: 32px;
      height: 32px;
      background: none;
      border: none;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5f6368;
      font-size: 18px;
      transition: background .15s;
    }

    .g-close:hover {
      background: #f1f3f4;
    }

    /* ── Body ── */
    .g-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .g-title {
      padding: 16px 24px 4px;
      font-size: 16px;
      font-weight: 400;
      color: #202124;
    }

    .g-sub {
      padding: 0 24px 14px;
      font-size: 13px;
      color: #5f6368;
    }

    /* ── Account rows ── */
    .g-account {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 24px;
      cursor: pointer;
      transition: background .12s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .g-account:hover {
      background: #f8f9fa;
    }

    .g-account:active {
      background: #e8f0fe;
    }

    .g-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 500;
      color: #fff;
      flex-shrink: 0;
      background: #4285f4;
    }

    .g-account-info {
      flex: 1;
      min-width: 0;
    }

    .g-account-name {
      font-size: 14px;
      font-weight: 500;
      color: #202124;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .g-account-email {
      font-size: 12px;
      color: #5f6368;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .g-chevron {
      color: #bdc1c6;
      font-size: 14px;
      flex-shrink: 0;
    }

    /* ── Divider ── */
    .g-divider {
      height: 1px;
      background: #e8eaed;
      margin: 6px 0;
    }

    /* ── Use another account ── */
    .g-other {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 24px;
      cursor: pointer;
      color: #1a73e8;
      font-size: 14px;
      font-weight: 500;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      transition: background .12s;
    }

    .g-other:hover {
      background: #f8f9fa;
    }

    .g-other-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid #dadce0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #5f6368;
    }

    /* ── Custom email form ── */
    .g-email-form {
      display: none;
      padding: 8px 24px 16px;
      flex-direction: column;
      gap: 12px;
    }

    .g-email-form.open {
      display: flex;
    }

    .g-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #dadce0;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      color: #202124;
      transition: border-color .15s;
    }

    .g-input:focus {
      border-color: #1a73e8;
    }

    .g-btn-row {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .g-btn {
      padding: 9px 20px;
      border-radius: 4px;
      border: none;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background .12s;
    }

    .g-btn-text {
      background: none;
      color: #1a73e8;
    }

    .g-btn-text:hover {
      background: #e8f0fe;
    }

    .g-btn-contained {
      background: #1a73e8;
      color: #fff;
    }

    .g-btn-contained:hover {
      background: #1557b0;
    }

    /* ── Footer ── */
    .g-footer {
      padding: 10px 24px 14px;
      border-top: 1px solid #e8eaed;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #5f6368;
    }

    .g-footer a {
      color: #1a73e8;
      text-decoration: none;
    }

    .g-footer a:hover {
      text-decoration: underline;
    }

    /* ── Loading state ── */
    .g-loading {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      gap: 16px;
    }

    .g-loading.show {
      display: flex;
    }

    .g-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e8eaed;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .g-loading-text {
      font-size: 14px;
      color: #5f6368;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="g-header">
    <div class="g-logo">
      <!-- Google G -->
      <svg width="22" height="22" viewBox="0 0 48 48">
        <path fill="#EA4335"
          d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
        <path fill="#4285F4"
          d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
        <path fill="#FBBC05"
          d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
        <path fill="#34A853"
          d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
      </svg>
      Google
    </div>
    <button class="g-close" onclick="window.close()" title="Close">✕</button>
  </div>

  <!-- Main chooser -->
  <div class="g-body" id="main-chooser">
    <div class="g-title">Choose an account</div>
    <div class="g-sub">to continue to EchoEats</div>

    <!-- Demo accounts -->
    <button class="g-account" onclick="signInWith('Demo Consumer','consumer@gmail.com','#4285f4')">
      <div class="g-avatar" style="background:#4285f4">D</div>
      <div class="g-account-info">
        <div class="g-account-name">Demo Consumer</div>
        <div class="g-account-email">consumer@gmail.com</div>
      </div>
      <div class="g-chevron">›</div>
    </button>

    <button class="g-account" onclick="signInWith('Nadia Mahmoud','nadia.mahmoud@gmail.com','#34a853')">
      <div class="g-avatar" style="background:#34a853">N</div>
      <div class="g-account-info">
        <div class="g-account-name">Nadia Mahmoud</div>
        <div class="g-account-email">nadia.mahmoud@gmail.com</div>
      </div>
      <div class="g-chevron">›</div>
    </button>

    <button class="g-account" onclick="signInWith('Alex Chen','alex.chen@gmail.com','#ea4335')">
      <div class="g-avatar" style="background:#ea4335">A</div>
      <div class="g-account-info">
        <div class="g-account-name">Alex Chen</div>
        <div class="g-account-email">alex.chen@gmail.com</div>
      </div>
      <div class="g-chevron">›</div>
    </button>

    <div class="g-divider"></div>

    <!-- Use another account -->
    <button class="g-other" onclick="toggleEmailForm()">
      <div class="g-other-icon">＋</div>
      Use another account
    </button>

    <!-- Custom email form -->
    <div class="g-email-form" id="email-form">
      <input class="g-input" id="custom-email" type="email" placeholder="Email or phone" autocomplete="email" />
      <div class="g-btn-row">
        <button class="g-btn g-btn-text" onclick="toggleEmailForm()">Cancel</button>
        <button class="g-btn g-btn-contained" onclick="signInWithCustom()">Next</button>
      </div>
    </div>
  </div>

  <!-- Loading state -->
  <div class="g-loading" id="loading">
    <div class="g-spinner"></div>
    <div class="g-loading-text">Signing you in…</div>
  </div>

  <!-- Footer -->
  <div class="g-footer">
    <a href="#">Privacy Policy</a>
    <a href="#">Terms of Service</a>
  </div>

  <script>
    var mode = (new URLSearchParams(window.location.search)).get('mode') || 'signin';

    function signInWith(name, email, color) {
      document.getElementById('main-chooser').style.display = 'none';
      document.getElementById('loading').classList.add('show');

      var avatarColor = color || '#4285f4';
      var initial = name.charAt(0).toUpperCase();

      setTimeout(function () {
        var payload = {
          type: 'GOOGLE_AUTH_SUCCESS',
          name: name,
          email: email,
          avatarColor: avatarColor,
          initial: initial,
          mode: mode
        };

        if (window.opener) {
          window.opener.postMessage(payload, '*');
        }
        window.close();
      }, 1200);
    }

    function signInWithCustom() {
      var email = document.getElementById('custom-email').value.trim();
      if (!email || !email.includes('@')) {
        document.getElementById('custom-email').style.borderColor = '#ea4335';
        document.getElementById('custom-email').focus();
        return;
      }
      // Derive a name from the email local part
      var local = email.split('@')[0];
      var name = local.split(/[._-]/).map(function (w) {
        return w.charAt(0).toUpperCase() + w.slice(1);
      }).join(' ');

      var colors = ['#4285f4', '#34a853', '#ea4335', '#fbbc05', '#9c27b0'];
      var color = colors[name.charCodeAt(0) % colors.length];
      signInWith(name, email, color);
    }

    function toggleEmailForm() {
      var form = document.getElementById('email-form');
      var isOpen = form.classList.contains('open');
      form.classList.toggle('open', !isOpen);
      if (!isOpen) setTimeout(function () { document.getElementById('custom-email').focus(); }, 50);
    }

    // Allow pressing Enter in custom email field
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && document.getElementById('email-form').classList.contains('open')) {
        signInWithCustom();
      }
    });
  </script>
</body>

</html>
