<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — EchoEats</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>" />
</head>

<body class="auth-page" style="padding-top:0">

  <!-- Full Navbar -->
  <nav class="navbar scrolled" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <div class="nav-logo-icon">🌿</div>EchoEats
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="listings.html">Browse Deals</a></li>
        <li><a href="how-it-works.html">How It Works</a></li>
        <li><a href="vendors.html">For Vendors</a></li>
        <li><a href="impact.html">Our Impact</a></li>
        <li><a href="notifications.html">🔔 Notifications</a></li>
      </ul>
      <div class="nav-cta">
        <a href="login.html" class="nav-signin active">Sign In</a>
        <a href="register.html" class="btn btn-primary btn-sm">Get Started</a>
      </div>
    </div>
  </nav>

  <!-- Body -->
  <div class="auth-body" style="padding-top: calc(var(--nav-h, 72px) + 40px)">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:24px">
        <div style="font-size:44px;margin-bottom:12px">👋</div>
        <div class="auth-title">Welcome back</div>
        <div class="auth-subtitle">Sign in to your EchoEats account</div>
      </div>

      <form onsubmit="handleLogin(event)">
        <div style="margin-bottom:16px">
          <label class="form-label"
            style="display:block;font-size:13px;font-weight:600;color:var(--text-soft);margin-bottom:5px">Email
            Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required
            style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;outline:none;transition:border-color .2s;background:var(--white);color:var(--dark)">
        </div>
        <div style="margin-bottom:16px">
          <label class="form-label"
            style="display:block;font-size:13px;font-weight:600;color:var(--text-soft);margin-bottom:5px">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="Your password" required
            style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;outline:none;transition:border-color .2s;background:var(--white);color:var(--dark)">
        </div>
        <div id="login-error" class="auth-error"></div>
        <button type="submit" class="btn btn-primary"
          style="width:100%;justify-content:center;padding:13px;font-size:15px">
          Sign In
        </button>
      </form>

      <div style="display:flex;align-items:center;gap:12px;margin:16px 0">
        <div style="flex:1;height:1px;background:var(--border)"></div>
        <span style="font-size:12px;color:var(--text-muted);font-weight:600">OR</span>
        <div style="flex:1;height:1px;background:var(--border)"></div>
      </div>
      <button type="button" id="google-btn" onclick="openGoogleSignIn()"
        style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border:1.5px solid var(--border);border-radius:12px;background:var(--white);font-size:15px;font-weight:600;color:var(--dark);cursor:pointer;transition:box-shadow 0.2s"
        onmouseover="this.style.boxShadow='0 2px 8px rgba(0,0,0,0.12)'" onmouseout="this.style.boxShadow=''">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>
      <p style="margin-top:16px;text-align:center;font-size:13px;color:var(--text-muted)">
        Don't have an account? <a href="register.html" style="color:var(--green-700);font-weight:600">Sign up free</a>
      </p>
    </div>
  </div>

  <script src="main.js"></script>
  <script>
    // @ts-nocheck
    (function () {
      if (!localStorage.getItem('ee_users')) {
        var users = [
          { id: 'u1', name: 'Demo Consumer', email: 'consumer@test.com', password: '123456', role: 'consumer', status: 'approved', mealsSaved: 47, co2Saved: 22.6, streak: 7, badges: ['🌱', '💚', '🔥'] },
          { id: 'v1', name: 'Nadia Mahmoud', email: 'vendor@test.com', password: '123456', role: 'vendor', status: 'approved', businessName: 'Patisserie Nour', businessType: 'Bakery', mealsSaved: 0, co2Saved: 0, streak: 0, badges: [] },
          { id: 'a1', name: 'EchoEats Admin', email: 'admin@echoeats.com', password: 'admin123', role: 'admin', status: 'approved', mealsSaved: 0, co2Saved: 0, streak: 0, badges: [] }
        ];
        localStorage.setItem('ee_users', JSON.stringify(users));
      }
    })();

    function openGoogleSignIn() {
      var w = 420, h = 500;
      var left = Math.round(screen.width  / 2 - w / 2);
      var top  = Math.round(screen.height / 2 - h / 2);
      window.open(
        'google-oauth.html?mode=signin',
        'GoogleSignIn',
        'width='+w+',height='+h+',left='+left+',top='+top+',resizable=no,scrollbars=no,status=no,toolbar=no,menubar=no'
      );
    }

    window.addEventListener('message', function(e) {
      if (!e.data || e.data.type !== 'GOOGLE_AUTH_SUCCESS') return;
      var data = e.data;

      // Find existing user by Google email, or create one
      var users = JSON.parse(localStorage.getItem('ee_users') || '[]');
      var user = users.find(function(u) { return u.email === data.email; });

      if (!user) {
        // Auto-create a consumer account for new Google users
        user = {
          id: 'g' + Date.now(),
          name: data.name,
          email: data.email,
          password: '',
          role: 'consumer',
          status: 'approved',
          googleAuth: true,
          avatarColor: data.avatarColor,
          mealsSaved: 0, co2Saved: 0, streak: 0, badges: [],
          joinDate: new Date().toISOString()
        };
        users.push(user);
        localStorage.setItem('ee_users', JSON.stringify(users));
      }

      localStorage.setItem('ee_current_user', JSON.stringify(user));
      localStorage.setItem('ee_has_logged_in', '1');
      showToast('👋 Welcome, ' + user.name.split(' ')[0] + '!');
      setTimeout(function() {
        if (user.role === 'admin') window.location.href = 'admin.html';
        else if (user.role === 'vendor') window.location.href = 'vendor-dashboard.html';
        else window.location.href = 'consumer-dashboard.html';
      }, 700);
    });

    function handleLogin(e) {
      e.preventDefault();
      var email = document.getElementById('login-email').value.trim();
      var pass = document.getElementById('login-password').value;
      var errEl = document.getElementById('login-error');
      var users = JSON.parse(localStorage.getItem('ee_users') || '[]');
      var user = null;
      for (var i = 0; i < users.length; i++) {
        if (users[i].email === email && users[i].password === pass) {
          user = users[i];
          break;
        }
      }
      errEl.style.display = 'none';
      if (!user) {
        errEl.textContent = 'Invalid email or password. Try the demo buttons below.';
        errEl.style.display = 'block';
        return;
      }
      localStorage.setItem('ee_current_user', JSON.stringify(user));
      localStorage.setItem('ee_has_logged_in', '1');

      // Block pending vendors from logging in
      if (user.role === 'vendor' && user.status === 'pending') {
        errEl.innerHTML = '⏳ Your vendor account is <strong>pending approval</strong>. You\'ll be notified within 24 hours. <a href="index.html" style="color:var(--green-700)">Go home</a>';
        errEl.style.display = 'block';
        localStorage.removeItem('ee_current_user');
        return;
      }

      showToast('Welcome back, ' + user.name.split(' ')[0] + '!');
      setTimeout(function () {
        if (user.role === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = user.role === 'vendor' ? 'vendor-dashboard.html' : 'consumer-dashboard.html';
        }
      }, 700);
    }


  </script>

</body>

</html>
