<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — EchoEats</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .plan-card {
      display: block;
      position: relative;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.18s;
      background: var(--white);
    }

    .plan-card:hover {
      border-color: var(--green-400);
      background: var(--green-50);
    }

    .plan-card.selected {
      border-color: var(--green-700);
      background: var(--green-50);
      box-shadow: 0 0 0 3px rgba(22, 101, 52, .1);
    }

    .plan-popular {
      border-color: var(--green-300);
    }

    /* Radio indicator — sits to the LEFT of the plan name, never overlaps price */
    .plan-radio {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      margin-top: 2px;
    }

    .plan-card.selected .plan-radio {
      border-color: var(--green-700);
      background: var(--green-700);
    }

    .plan-radio-dot {
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .plan-card.selected .plan-radio-dot {
      opacity: 1;
    }

    .plan-feat {
      background: var(--green-100);
      color: var(--green-800);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 100px;
    }

    #vendor-fields {
      display: none;
    }
  </style>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>" />
</head>

<body class="auth-page" style="padding-top:0">

  <!-- Full Navbar -->
  <nav class="navbar scrolled" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <div class="nav-logo-icon">🌿</div>EchoEats
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="listings.html">Browse Deals</a></li>
        <li><a href="how-it-works.html">How It Works</a></li>
        <li><a href="vendors.html">For Vendors</a></li>
        <li><a href="impact.html">Our Impact</a></li>
        <li><a href="notifications.html">🔔 Notifications</a></li>
      </ul>
      <div class="nav-cta">
        <a href="login.html" class="nav-signin">Sign In</a>
        <a href="register.html" class="btn btn-primary btn-sm">Get Started</a>
      </div>
    </div>
  </nav>

  <div class="auth-body" style="padding-top: calc(var(--nav-h, 72px) + 40px)">
    <div class="auth-card" style="max-width:520px">
      <div style="text-align:center;margin-bottom:22px">
        <div style="font-size:44px;margin-bottom:12px">🌿</div>
        <div class="auth-title">Create your account</div>
        <div class="auth-subtitle">Join thousands saving money and fighting food waste</div>
      </div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tab-consumer"
          onclick="switchRole('consumer')">Consumer</button>
        <button type="button" class="auth-tab" id="tab-vendor" onclick="switchRole('vendor')">Vendor</button>
      </div>

      <form onsubmit="handleRegister(event)">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:0">
          <div style="margin-bottom:14px">
            <label style="display:block;font-size:13px;font-weight:600;color:var(--text-soft);margin-bottom:5px">First
              Name</label>
            <input type="text" id="r-first" placeholder="Yousif" required maxlength="50"
              style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;outline:none;background:var(--white);color:var(--dark);transition:border-color .2s">
          </div>
          <div style="margin-bottom:14px">
            <label style="display:block;font-size:13px;font-weight:600;color:var(--text-soft);margin-bottom:5px">Last
              Name</label>
            <input type="text" id="r-last" placeholder="Shakeeb" required maxlength="50"
              style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;outline:none;background:var(--white);color:var(--dark);transition:border-color .2s">
          </div>
        </div>
        <div style="margin-bottom:14px">
          <label style="display:block;font-size:13px;font-weight:600;color:var(--text-soft);margin-bottom:5px">Email
            Address</label>
          <input type="email" id="r-email" placeholder="you@example.com" required maxlength="100"
            style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;outline:none;background:var(--white);color:var(--dark);transition:border-color .2s">
        </div>
        <div style="margin-bottom:14px">
          <label
            style="display:block;font-size:13px;font-weight:600;color:var(--text-soft);margin-bottom:5px">Password</label>
          <input type="password" id="r-pass" placeholder="Min 6 characters" required minlength="6"
            style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;outline:none;background:var(--white);color:var(--dark);transition:border-color .2s">
        </div>

        <div id="consumer-fields">
          <div style="margin-bottom:14px">
            <label style="display:block;font-size:13px;font-weight:600;color:var(--text-soft);margin-bottom:7px">
              Dietary Preferences <span style="color:var(--text-muted);font-weight:400">(optional)</span>
            </label>
            <div class="diet-chips">
              <button type="button" class="diet-chip" onclick="toggleDiet(this,'Vegan')">🌿 Vegan</button>
              <button type="button" class="diet-chip" onclick="toggleDiet(this,'Halal')">☪️ Halal</button>
              <button type="button" class="diet-chip" onclick="toggleDiet(this,'Gluten-free')">🌾 Gluten-free</button>
              <button type="button" class="diet-chip" onclick="toggleDiet(this,'Peanut-free')">🥜 Peanut-free</button>
            </div>
          </div>
          <div style="margin-bottom:14px">
            <label
              style="display:block;font-size:13px;font-weight:600;color:var(--text-soft);margin-bottom:5px">Location /
              Area</label>
            <input type="text" id="r-location" placeholder="e.g. Manama, Bahrain" maxlength="100"
              style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;outline:none;background:var(--white);color:var(--dark)">
          </div>
          <div style="margin-bottom:14px">
            <label style="display:block;font-size:13px;font-weight:600;color:var(--text-soft);margin-bottom:5px">Phone
              Number <span style="color:var(--text-muted);font-weight:400">(optional)</span></label>
            <input type="tel" id="r-phone" placeholder="+973 XXXX XXXX" maxlength="20"
              style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;outline:none;background:var(--white);color:var(--dark)">
          </div>
        </div>

        <div id="vendor-fields" style="display:none">
          <div style="margin-bottom:14px">
            <label
              style="display:block;font-size:13px;font-weight:600;color:var(--text-soft);margin-bottom:5px">Business
              Name</label>
            <input type="text" id="r-biz" placeholder="e.g. Patisserie Nour" maxlength="80"
              style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;outline:none;background:var(--white);color:var(--dark)">
          </div>
          <div style="margin-bottom:14px">
            <label
              style="display:block;font-size:13px;font-weight:600;color:var(--text-soft);margin-bottom:5px">Business
              Type</label>
            <select id="r-biztype"
              style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;outline:none;background:var(--white);color:var(--dark)">
              <option value="">Select type...</option>
              <option>Restaurant</option>
              <option>Cafe / Coffee Shop</option>
              <option>Bakery</option>
              <option>Supermarket</option>
              <option>Home Cook</option>
            </select>
          </div>
          <div style="margin-bottom:14px">
            <label
              style="display:block;font-size:13px;font-weight:600;color:var(--text-soft);margin-bottom:5px">Business
              Address</label>
            <input type="text" id="r-address" placeholder="Full address" maxlength="150"
              style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;outline:none;background:var(--white);color:var(--dark)">
          </div>
          <div style="margin-bottom:14px">
            <label style="display:block;font-size:13px;font-weight:600;color:var(--text-soft);margin-bottom:5px">Phone
              Number <span style="color:var(--text-muted);font-weight:400">(optional)</span></label>
            <input type="tel" id="r-phone-vendor" placeholder="+973 XXXX XXXX" maxlength="20"
              style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;outline:none;background:var(--white);color:var(--dark)">
          </div>

          <!-- Vendor Plan Picker -->
          <div style="margin-bottom:6px">
            <label style="display:block;font-size:13px;font-weight:600;color:var(--text-soft);margin-bottom:10px">Choose
              your plan</label>
            <div id="plan-cards" style="display:flex;flex-direction:column;gap:10px">

              <!-- Starter -->
              <label class="plan-card" id="plan-starter" onclick="selectPlan('starter')">
                <input type="radio" name="vendor-plan" value="starter" checked style="display:none">
                <div style="display:flex;align-items:flex-start;gap:12px">
                  <div class="plan-radio">
                    <div class="plan-radio-dot"></div>
                  </div>
                  <div style="flex:1;min-width:0">
                    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
                      <div style="font-size:14px;font-weight:800;color:var(--dark)">🌱 Starter</div>
                      <div style="flex-shrink:0;text-align:right">
                        <span style="font-size:15px;font-weight:900;color:var(--green-700)">Free</span>
                        <div style="font-size:10px;color:var(--text-muted)">forever</div>
                      </div>
                    </div>
                    <div style="font-size:12px;color:var(--text-muted);margin-top:2px;margin-bottom:8px">Perfect for
                      home cooks & small cafes</div>
                    <div style="display:flex;flex-wrap:wrap;gap:5px">
                      <span class="plan-feat">5 listings/day</span>
                      <span class="plan-feat">Linear decay only</span>
                      <span class="plan-feat">Basic analytics</span>
                      <span class="plan-feat">Stripe payouts</span>
                      <span class="plan-feat">Email support</span>
                    </div>
                  </div>
                </div>
              </label>

              <!-- Growth -->
              <label class="plan-card plan-popular" id="plan-growth" onclick="selectPlan('growth')">
                <input type="radio" name="vendor-plan" value="growth" style="display:none">
                <div
                  style="position:absolute;top:-1px;right:14px;background:var(--green-700);color:#fff;font-size:10px;font-weight:800;padding:3px 10px;border-radius:0 0 8px 8px;letter-spacing:.5px">
                  MOST POPULAR</div>
                <div style="display:flex;align-items:flex-start;gap:12px;padding-top:6px">
                  <div class="plan-radio">
                    <div class="plan-radio-dot"></div>
                  </div>
                  <div style="flex:1;min-width:0">
                    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
                      <div style="font-size:14px;font-weight:800;color:var(--dark)">🚀 Growth</div>
                      <div style="flex-shrink:0;text-align:right">
                        <span style="font-size:15px;font-weight:900;color:var(--green-700)">BD 15</span><span
                          style="font-size:11px;color:var(--text-muted)">/mo</span>
                        <div style="font-size:10px;color:var(--text-muted)">billed monthly</div>
                      </div>
                    </div>
                    <div style="font-size:12px;color:var(--text-muted);margin-top:2px;margin-bottom:8px">For growing
                      restaurants & bakeries</div>
                    <div style="display:flex;flex-wrap:wrap;gap:5px">
                      <span class="plan-feat">Unlimited listings</span>
                      <span class="plan-feat">All 3 decay curves</span>
                      <span class="plan-feat">Full analytics</span>
                      <span class="plan-feat">Demand alerts</span>
                      <span class="plan-feat">Priority support</span>
                      <span class="plan-feat">Sustainability badge</span>
                    </div>
                  </div>
                </div>
              </label>

              <!-- Enterprise -->
              <label class="plan-card" id="plan-enterprise" onclick="selectPlan('enterprise')">
                <input type="radio" name="vendor-plan" value="enterprise" style="display:none">
                <div style="display:flex;align-items:flex-start;gap:12px">
                  <div class="plan-radio">
                    <div class="plan-radio-dot"></div>
                  </div>
                  <div style="flex:1;min-width:0">
                    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
                      <div style="font-size:14px;font-weight:800;color:var(--dark)">🏢 Enterprise</div>
                      <div style="flex-shrink:0;text-align:right">
                        <span style="font-size:15px;font-weight:900;color:var(--green-700)">Custom</span>
                        <div style="font-size:10px;color:var(--text-muted)">contact us</div>
                      </div>
                    </div>
                    <div style="font-size:12px;color:var(--text-muted);margin-top:2px;margin-bottom:8px">For chains &
                      large-scale operations</div>
                    <div style="display:flex;flex-wrap:wrap;gap:5px">
                      <span class="plan-feat">Multi-location</span>
                      <span class="plan-feat">API access</span>
                      <span class="plan-feat">ML pricing predictions</span>
                      <span class="plan-feat">A/B testing</span>
                      <span class="plan-feat">Dedicated manager</span>
                      <span class="plan-feat">White-label</span>
                    </div>
                  </div>
                </div>
              </label>
            </div>
          </div>
        </div>

        <div id="reg-error" style="display:none;color:red;font-size:12px;margin-bottom:10px;"></div>

        <button type="submit" class="btn btn-primary"
          style="width:100%;justify-content:center;padding:13px;font-size:15px;margin-top:4px">
          Create Account
        </button>
      </form>
      <div style="display:flex;align-items:center;gap:12px;margin:16px 0">
        <div style="flex:1;height:1px;background:var(--border)"></div>
        <span style="font-size:12px;color:var(--text-muted);font-weight:600">OR</span>
        <div style="flex:1;height:1px;background:var(--border)"></div>
      </div>
      <button type="button" id="google-btn" onclick="openGoogleSignUp()"
        style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border:1.5px solid var(--border);border-radius:12px;background:var(--white);font-size:15px;font-weight:600;color:var(--dark);cursor:pointer;transition:box-shadow 0.2s"
        onmouseover="this.style.boxShadow='0 2px 8px rgba(0,0,0,0.12)'" onmouseout="this.style.boxShadow=''">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335"
            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
          <path fill="#4285F4"
            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
          <path fill="#FBBC05"
            d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
          <path fill="#34A853"
            d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
        </svg>
        Continue with Google
      </button>
      <p style="margin-top:16px;text-align:center;font-size:13px;color:var(--text-muted)">
        Already have an account? <a href="login.html" style="color:var(--green-700);font-weight:600">Sign in</a>
      </p>
    </div>
  </div>

  <script src="main.js"></script>
  <script>
    // @ts-nocheck
    function openGoogleSignUp() {
      var w = 420, h = 500;
      var left = Math.round(screen.width / 2 - w / 2);
      var top = Math.round(screen.height / 2 - h / 2);
      window.open(
        'google-oauth.html?mode=signup',
        'GoogleSignIn',
        'width=' + w + ',height=' + h + ',left=' + left + ',top=' + top + ',resizable=no,scrollbars=no,status=no,toolbar=no,menubar=no'
      );
    }

    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'GOOGLE_AUTH_SUCCESS') return;
      var data = e.data;
      var users = JSON.parse(localStorage.getItem('ee_users') || '[]');
      var existing = users.find(function (u) { return u.email === data.email; });

      if (existing) {
        // Already registered — just sign them in
        localStorage.setItem('ee_current_user', JSON.stringify(existing));
        localStorage.setItem('ee_has_logged_in', '1');
        showToast('👋 Welcome back, ' + existing.name.split(' ')[0] + '!');
        setTimeout(function () {
          window.location.href = existing.role === 'vendor' ? 'vendor-dashboard.html' : 'consumer-dashboard.html';
        }, 700);
        return;
      }

      // New user — create consumer account
      var newUser = {
        id: 'g' + Date.now(),
        name: data.name,
        email: data.email,
        password: '',
        role: 'consumer',
        status: 'approved',
        googleAuth: true,
        avatarColor: data.avatarColor,
        mealsSaved: 0, co2Saved: 0, streak: 0, badges: [],
        joinDate: new Date().toISOString()
      };
      users.push(newUser);
      localStorage.setItem('ee_users', JSON.stringify(users));
      localStorage.setItem('ee_current_user', JSON.stringify(newUser));
      localStorage.setItem('ee_has_logged_in', '1');
      showToast('🎉 Account created! Welcome, ' + newUser.name.split(' ')[0] + '!');
      setTimeout(function () { window.location.href = 'consumer-dashboard.html'; }, 700);
    });

    var currentRole = 'consumer';
    var selectedDiets = [];
    var selectedPlan = 'starter';

    function selectPlan(plan) {
      selectedPlan = plan;
      ['starter', 'growth', 'enterprise'].forEach(function (p) {
        var el = document.getElementById('plan-' + p);
        if (el) el.classList.toggle('selected', p === plan);
      });
    }

    function switchRole(role) {
      currentRole = role;
      document.getElementById('tab-consumer').classList.toggle('active', role === 'consumer');
      document.getElementById('tab-vendor').classList.toggle('active', role === 'vendor');
      document.getElementById('consumer-fields').style.display = (role === 'consumer' ? 'block' : 'none');
      document.getElementById('vendor-fields').style.display = (role === 'vendor' ? 'block' : 'none');
    }

    function toggleDiet(btn, diet) {
      btn.classList.toggle('active');
      var i = selectedDiets.indexOf(diet);
      if (i >= 0) { selectedDiets.splice(i, 1); } else { selectedDiets.push(diet); }
    }

    function handleRegister(e) {
      e.preventDefault();
      var errEl = document.getElementById('reg-error');
      errEl.style.display = 'none';

      var first = document.getElementById('r-first').value.trim();
      var last = document.getElementById('r-last').value.trim();
      var email = document.getElementById('r-email').value.trim();
      var pass = document.getElementById('r-pass').value;

      var users = JSON.parse(localStorage.getItem('ee_users') || '[]');
      for (var i = 0; i < users.length; i++) {
        if (users[i].email === email) {
          errEl.textContent = 'Email already registered — try signing in instead.';
          errEl.style.display = 'block';
          return;
        }
      }

      var newUser = {
        id: 'u' + Date.now(),
        name: first + ' ' + last,
        email: email,
        password: pass,
        role: currentRole,
        mealsSaved: 0, co2Saved: 0, streak: 0, badges: [],
        joinDate: new Date().toISOString()
      };

      if (currentRole === 'consumer') {
        newUser.dietary = selectedDiets.slice();
        newUser.location = document.getElementById('r-location').value.trim();
        newUser.status = 'approved';
      } else {
        var bizName = document.getElementById('r-biz').value.trim();
        if (!bizName) {
          errEl.textContent = 'Please enter your business name.';
          errEl.style.display = 'block';
          return;
        }
        newUser.businessName = bizName;
        newUser.businessType = document.getElementById('r-biztype').value;
        newUser.businessAddress = document.getElementById('r-address').value.trim();
        newUser.plan = selectedPlan;
        newUser.status = 'pending';
      }

      users.push(newUser);
      localStorage.setItem('ee_users', JSON.stringify(users));
      localStorage.setItem('ee_current_user', JSON.stringify(newUser));
      localStorage.setItem('ee_has_logged_in', '1');

      if (currentRole === 'vendor') {
        var planLabels = { starter: '🌱 Starter (Free)', growth: '🚀 Growth (BD 15/mo)', enterprise: '🏢 Enterprise (Custom)' };
        var _secretClicks = 0, _secretTimer = null;
        document.querySelector('.auth-card').innerHTML = `
          <div style="text-align:center;padding:20px 0">
            <div id="reg-pending-icon" style="font-size:56px;margin-bottom:16px;cursor:default;user-select:none;display:inline-block;transition:transform 0.15s">⏳</div>
            <div class="auth-title" style="margin-bottom:6px">Application Submitted</div>
            <div class="auth-subtitle" style="margin-bottom:24px">Your vendor account is currently under review.</div>

            <div style="background:var(--green-50);border:1.5px solid var(--green-200);border-radius:16px;padding:20px;text-align:left;margin-bottom:16px">
              <div style="font-size:13px;font-weight:700;color:var(--green-700);margin-bottom:12px">📋 What happens next</div>
              <div style="display:flex;flex-direction:column;gap:12px">
                <div style="display:flex;gap:12px;align-items:flex-start">
                  <div style="width:24px;height:24px;border-radius:50%;background:var(--green-700);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px">1</div>
                  <div>
                    <div style="font-size:13px;font-weight:700;color:var(--dark);margin-bottom:2px">Application Review</div>
                    <div style="font-size:12px;color:var(--text-soft)">Our team will review your business details within <strong>24 hours</strong> of submission.</div>
                  </div>
                </div>
                <div style="display:flex;gap:12px;align-items:flex-start">
                  <div style="width:24px;height:24px;border-radius:50%;background:var(--green-700);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px">2</div>
                  <div>
                    <div style="font-size:13px;font-weight:700;color:var(--dark);margin-bottom:2px">Approval Notification</div>
                    <div style="font-size:12px;color:var(--text-soft)">Upon approval, you will receive a confirmation email at <strong>${email}</strong> with a secure link to complete your account setup.</div>
                  </div>
                </div>
                <div style="display:flex;gap:12px;align-items:flex-start">
                  <div style="width:24px;height:24px;border-radius:50%;background:var(--green-700);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px">3</div>
                  <div>
                    <div style="font-size:13px;font-weight:700;color:var(--dark);margin-bottom:2px">Payment & Activation</div>
                    <div style="font-size:12px;color:var(--text-soft)">The email will include a payment link to activate your selected plan. Once payment is confirmed, your vendor dashboard will be fully unlocked and you can begin listing your surplus food immediately.</div>
                  </div>
                </div>
              </div>
            </div>

            <div style="background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:20px;text-align:left;font-size:12px;color:var(--text-muted);display:flex;flex-direction:column;gap:4px">
              <div><span style="font-weight:600;color:var(--dark)">Business:</span> ${bizName}</div>
              <div><span style="font-weight:600;color:var(--dark)">Plan:</span> ${planLabels[newUser.plan]}</div>
              <div><span style="font-weight:600;color:var(--dark)">Notification email:</span> ${email}</div>
            </div>

            <a href="index.html" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px;font-size:15px;display:flex">Back to Home</a>
            <p style="margin-top:12px;font-size:12px;color:var(--text-muted)">Questions? Contact us at <a href="mailto:support@echoeats.com" style="color:var(--green-700)">support@echoeats.com</a></p>
          </div>`;

        document.getElementById('reg-pending-icon').addEventListener('click', function () {
          _secretClicks++;
          this.style.transform = 'scale(1.4)';
          setTimeout(() => this.style.transform = '', 150);
          clearTimeout(_secretTimer);
          if (_secretClicks >= 5) {
            var allUsers = JSON.parse(localStorage.getItem('ee_users') || '[]');
            var idx = allUsers.findIndex(function (u) { return u.email === email; });
            if (idx >= 0) { allUsers[idx].status = 'approved'; localStorage.setItem('ee_users', JSON.stringify(allUsers)); }
            var cu = JSON.parse(localStorage.getItem('ee_current_user') || '{}');
            cu.status = 'approved'; localStorage.setItem('ee_current_user', JSON.stringify(cu));
            this.textContent = '✅'; this.style.transform = 'scale(1.5)';
            showToast('🎉 Vendor access unlocked!');
            setTimeout(function () { window.location.href = 'vendor-dashboard.html'; }, 900);
          } else { _secretTimer = setTimeout(function () { _secretClicks = 0; }, 1500); }
        });
        return;
      }

      setTimeout(function () { window.location.href = 'consumer-dashboard.html'; }, 500);
    }

    // Pre-select starter plan on load
    document.addEventListener('DOMContentLoaded', function () {
      selectPlan('starter');
    });
  </script>
</body>

</html>
